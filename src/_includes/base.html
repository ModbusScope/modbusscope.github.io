<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://modbusscope.com{{ page.url }}">
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin="anonymous">
  <meta name="description"
        content="{{ description }}">
  {%- if keywords %}
  <meta name="keywords"
        content="{{ keywords }}">
  {%- endif %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ModbusScope">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{ ogTitle or title }}">
  <meta property="og:description"
        content="{{ ogDescription or description }}">
  <meta property="og:image"
        content="https://raw.githubusercontent.com/ModbusScope/ModbusScope/master/resources/icon/icon-256x256.png">
  <meta property="og:image:width" content="256">
  <meta property="og:image:height" content="256">
  <meta property="og:image:alt" content="ModbusScope application icon">
  <meta property="og:url" content="https://modbusscope.com{{ page.url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ ogTitle or title }}">
  <meta name="twitter:description"
        content="{{ ogDescription or description }}">
  <meta name="twitter:image"
        content="https://raw.githubusercontent.com/ModbusScope/ModbusScope/master/resources/icon/icon-256x256.png">
  <meta name="twitter:image:alt" content="ModbusScope application icon">
  <link rel="icon"
        href="https://raw.githubusercontent.com/ModbusScope/ModbusScope/master/resources/icon/icon-256x256.png"
        type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <title>{{ title }}</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "@id": "https://modbusscope.com/#software",
        "name": "ModbusScope",
        "description": "Desktop application for real-time Modbus TCP/RTU data logging and visualization. Visualization core open-source under GPLv3. Supports all register types, custom expressions, and CSV export.",
        "url": "https://modbusscope.com/",
        "downloadUrl": "https://github.com/ModbusScope/ModbusScope/releases/latest",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": ["Windows", "Linux"],
        "softwareVersion": "{{ release.tag_name }}",
        "releaseNotes": "https://github.com/ModbusScope/ModbusScope/releases/latest",
        "license": "https://github.com/ModbusScope/ModbusScope/blob/master/LICENSE",
        "image": "https://raw.githubusercontent.com/ModbusScope/ModbusScope/master/resources/icon/icon-256x256.png",
        "screenshot": "https://raw.githubusercontent.com/ModbusScope/ModbusScope/master/modbusscope_demo.gif",
        "author": {
          "@id": "https://modbusscope.com/#organization"
        },
        "publisher": {
          "@id": "https://modbusscope.com/#organization"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://modbusscope.com/#organization",
        "name": "ModbusScope",
        "url": "https://modbusscope.com/",
        "logo": "https://raw.githubusercontent.com/ModbusScope/ModbusScope/master/resources/icon/icon-256x256.png",
        "sameAs": [
          "https://github.com/ModbusScope/ModbusScope"
        ]
      }
    ]
  }
  </script>
</head>
<body>

  <!-- NAV -->
  <div id="site-header">
    {% include "header.html" %}
  </div>
{{ content | safe }}
  <!-- FOOTER -->
  <div id="site-footer">
    {% include "footer.html" %}
  </div>
  <script src="/assets/js/nav.js" defer></script>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "c5bac092686e4c71acae983642427b34"}'></script>
</body>
</html>
